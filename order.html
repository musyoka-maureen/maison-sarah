<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maison Sarah</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="header-bar container">
      <header>
        <nav class="nav">
          <a href="index.html" target="_blank" rel="noopener noreferrer"
            >Home</a
          >
          <a href="menu.html" target="_blank" rel="noopener noreferrer">Menu</a>
          <a href="order.html" target="_blank" rel="noopener noreferrer"
            >Order</a
          >
        </nav>
        <p class="brand">Maison Sarah</p>
      </header>
    </div>
    <div class="container">
      <main>
        <h1>
          Make your orders <strong>NOW!</strong
          ><em>We are here to serve you.</em>
        </h1>
        <p>
          Fill below form to place your order. We will contact you to confirm
          your order and delivery details.
        </p>
        <form class="field label field:focus" action="#" method="get">
          <p>
            <label for="customer-name">Your name</label>
            <input
              class="field label field:focus input"
              type="text"
              id="customer-name"
              name="customer-name"
              required
              placeholder="Sarah Example"
            />
          </p>
          <p>
            <label for="email">Email:</label>
            <input
              class="field label field:focus input"
              type="email"
              id="email"
              name="email"
              required
              placeholder="john.doe@example.com"
            />
          </p>
          <input
            class="choice"
            type="radio"
            id="day-saturday"
            name="pickup-day"
            value="saturday"
            checked
          />
          <label for="day-saturday">Saturday</label>

          <input
            class="choice"
            type="radio"
            id="day-sunday"
            name="pickup-day"
            value="sunday"
          />
          <label for="day-sunday">Sunday</label>

          <p>Choose your preferred pickup time:</p>

          <div class="choice">
            <input
              class="choice"
              type="checkbox"
              id="time-saturday"
              name="pickup-time"
              value="11-12pm"
            /><label for="time-saturday">10:00 - 11:00</label>
          </div>

          <div class="choice">
            <input
              class="choice"
              type="checkbox"
              id="time-saturday2"
              name="pickup-time"
              value="12-13pm"
            /><label for="time-saturday2">11:00 - 12:00</label>
          </div>

          <div class="choice">
            <input
              class="choice"
              type="checkbox"
              id="time-saturday3"
              name="pickup-time"
              value="13-14pm"
            />
            <label for="time-saturday3">13:00 - 14:00</label>
          </div>
          <p><label for="Notes">Additional Notes:</label></p>
          <textarea id="Notes" name="order" rows="4" required></textarea>
          <p><button type="submit">Submit Order</button></p>
        </form>
      </main>
    </div>
    <footer class="container">&copy; All rights reserved</footer>
  </body>
</html>
